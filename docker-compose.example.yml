services:
  fricat-web:
    image: ghcr.io/wzyboy/fricat-web:master
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      FRICAT_TIMEZONE: 'America/Vancouver'
      FRICAT_CAMERA_NAMES: 'CAM1,CAM2,CAM3,CAM4,CAM5,CAM6,CAM7,CAM8'
    volumes:
      - '/media/frigate:/archive:ro'
